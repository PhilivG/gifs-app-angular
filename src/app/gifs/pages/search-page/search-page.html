<h2 class="text-2xl font-bold mt-4">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">Buscar gifs por nombre, descripción </h3>

<section>

  <input type="text"
  placeholder="Buscar Gifs"
  class="mt-3 border border-gray-300 rounded-md p-2 w-full"
  (keyup.enter)="onSearch(txtSearch.value)"
  #txtSearch
  >

</section>

<section class="py-5">
  <gifs-list-menu [gifs]="gifs()" />
</section>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  @for (groups of searchGifsMasonry(); track $index) {
    <gifs-list-menu [gifs]="groups" />
  }
</div>
