<div class="h-screen overflow-y-scroll pt-2 grid grid-cols-2 md:grid-cols-4 gap-4"
  (scroll)="onScroll($event)"
  #groupDiv
>
  @for (groups of gifService.trendingGifsMasonry(); track $index) {
    <div class="grid gap-4">
      @for (gif of groups; track gif.id) {
        <div>
          <img class="h-full w-full rounded-base" [src]="gif.url" [alt]="gif.title" />
        </div>
      }
    </div>
  }
</div>
